[project]
name = "youtuber_automation"
version = "0.1.0"
description = "A comprehensive solution for automating YouTube Shorts creation."
authors = [
  { name = "Your Name", email = "your.email@example.com" },
]
dependencies = [
  "pydub",
  "moviepy",
  "google-generativeai",
  "SpeechRecognition",
  "Pillow",
]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" } # Assuming you will create a LICENSE file

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"] # Search for packages in "src"

[tool.setuptools.package-data]
"youtuber_automation" = ["*.json"] # Include JSON files from the package directory
